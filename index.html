<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1520" />
    <meta
      name="description"
      content="Endless Driver — Phase 1 scene foundation: Three.js renderer, lighting, and debug camera."
    />
    <title>Endless Driver</title>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="app" class="relative h-dvh w-full overflow-hidden">
      <canvas
        id="viewport-canvas"
        class="block h-full w-full touch-none select-none"
        aria-label="Endless Driver 3D viewport"
      ></canvas>
      <div id="diagnostics-overlay" class="pointer-events-none absolute inset-0"></div>
      <div
        id="scene-status"
        class="scene-status"
        role="status"
        aria-live="polite"
        data-tone="info"
      ></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
