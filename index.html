<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1520" />
    <meta
      name="description"
      content="Endless Driver — a WebGPU-first open-world driving game you play right in the browser. Keyboard on desktop, on-screen joystick and pedals on mobile (landscape)."
    />
    <title>Endless Driver</title>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="app" class="relative h-dvh w-full overflow-hidden">
      <canvas
        id="viewport-canvas"
        class="block h-full w-full touch-none select-none"
        aria-label="Endless Driver 3D viewport"
      ></canvas>
      <div id="diagnostics-overlay" class="pointer-events-none absolute inset-0"></div>
      <div id="touch-controls" class="pointer-events-none absolute inset-0" hidden></div>
      <div id="rotate-overlay" class="rotate-overlay" hidden>
        <div class="rotate-overlay-card">
          <div class="rotate-overlay-icon" aria-hidden="true">📱↻</div>
          <p class="rotate-overlay-title">Rotate your device</p>
          <p class="rotate-overlay-text">
            Endless Driver is played in landscape — turn your phone sideways to drive.
          </p>
        </div>
      </div>
      <div id="studio-panel" class="studio-panel" hidden></div>
      <div
        id="scene-status"
        class="scene-status"
        role="status"
        aria-live="polite"
        data-tone="info"
      ></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
