<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1520" />
    <meta
      name="description"
      content="Endless Driver — a WebGPU-first open-world driving game you play right in the browser. Keyboard on desktop, on-screen joystick and pedals on mobile (landscape)."
    />
    <title>Endless Driver</title>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="app" class="relative h-dvh w-full overflow-hidden">
      <canvas
        id="viewport-canvas"
        class="block h-full w-full touch-none select-none"
        aria-label="Endless Driver 3D viewport"
      ></canvas>
      <div id="diagnostics-overlay" class="pointer-events-none absolute inset-0"></div>
      <div id="touch-controls" class="pointer-events-none absolute inset-0" hidden></div>
      <section id="loading-screen" class="loading-screen" aria-hidden="true" hidden>
        <div class="loading-screen-grid" aria-hidden="true"></div>
        <div class="loading-screen-content">
          <div class="loading-brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <p class="loading-eyebrow">OPEN-ROAD DRIVING</p>
          <h1 class="loading-title">ENDLESS <span>DRIVER</span></h1>
          <p class="loading-description">Aohara Central Avenue is getting ready.</p>
          <div class="loading-progress-copy">
            <span id="loading-stage-label">Starting the Aohara drive…</span>
            <span id="loading-percent" class="loading-percent">0%</span>
          </div>
          <div
            id="loading-progress"
            class="loading-progress-track"
            role="progressbar"
            aria-label="Game loading progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span id="loading-progress-fill" class="loading-progress-fill"></span>
          </div>
          <p class="loading-footnote">
            The drive begins automatically when the first scene is ready.
          </p>
          <button id="loading-retry" class="loading-retry" type="button" hidden>Reload game</button>
        </div>
      </section>
      <div id="studio-panel" class="studio-panel" hidden></div>
      <button
        id="credits-toggle"
        class="credits-toggle"
        type="button"
        aria-controls="credits-root"
        aria-label="Open asset credits"
      >
        Credits
      </button>
      <div id="credits-root" hidden></div>
      <div
        id="scene-status"
        class="scene-status"
        role="status"
        aria-live="polite"
        data-tone="info"
      ></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
