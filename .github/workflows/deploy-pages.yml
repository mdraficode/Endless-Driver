name: Deploy to GitHub Pages

# Publishes the playable build to https://mdraficode.github.io/Endless-Driver/ on every push to main.
#
# The site is a static bundle — no server, no tokens, no sandbox lifecycle — which is the point: the
# sandbox dev preview is token-gated and sleeps between sessions, so it cannot serve as a link that
# survives being shared or bookmarked. The build here is the same `vite build` the validation
# workflow runs, with `VITE_BASE_PATH` set to the project subpath Pages serves from.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue one at a time and let a newer push supersede a pending run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build the site for the project subpath
        run: npm run build
        env:
          VITE_BASE_PATH: /Endless-Driver/
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload the build as the Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
